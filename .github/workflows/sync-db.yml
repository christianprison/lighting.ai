name: Sync DB to Supabase

# ⚠️ SEIT DEM SUPABASE-CUTOVER (Option B, docs/cutover-uebergabe.md) NICHT MEHR
# DER NORMALE WEG: Supabase ist jetzt Master, nicht mehr db/lighting-ai-db.json.
# Der Auto-Trigger (push auf die DB-Datei) ist deshalb entfernt — sonst würde
# jeder Commit von export-db.yml (Supabase→Git) hierüber sofort rückwärts
# zurücksynchronisiert und Supabase mit dem gerade exportierten Stand
# überschreiben (Ringschluss, kein Schaden aber sinnlos, und riskant falls
# db/lighting-ai-db.json mal manuell/anders bearbeitet wird).
#
# Nur noch manueller Not-Aus/Restore-Weg: falls Supabase mal aus einem Git-
# Stand wiederhergestellt werden muss. Upsert (Adds/Mods) + Prune (Deletes),
# kein Audio-Upload (das macht upload-snippets.yml).
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

on:
  workflow_dispatch:

# Keine parallelen Syncs (sonst race auf den Tabellen).
concurrency:
  group: sync-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (inkl. audio/ für audio_assets-Abgleich)
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Supabase-Client installieren
        run: pip install "supabase>=2.4"

      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.central_db.sync_to_supabase
